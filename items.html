 <style>
  * {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}
.nav {
  font-family: sans-serif;
  background-color: white;
  z-index: 999;
  padding: 15px 50px;
  /* border-bottom: 1px solid black; */
  box-shadow: 0px 0px 05px 0px black;
  height: 90px;
  display: flex;
  align-items: center;
  position: fixed;
  right: 0;
  left: 0;
  top: 0;
  justify-content: space-between;
}
.nav-logo img {
  width: 120px;
}
.nav-right {
  display: flex;
  list-style: none;
  gap: 30px;
  font-size: 22px;
  width: 40%;
  justify-content: center;
}
.nav-right a {
  text-decoration: none;
  color: black;
}
.nav-right a:hover {
  color: rgb(8, 102, 179);
  font-weight: bolder;
}
.items-container {
  margin: 120px 0px 100px 0px;
  padding: 20px 50px;
  width: 100%;
  display: grid;
  /* grid-template-rows: 1fr 1fr 1fr; */
  grid-template-columns: 1fr 1fr 1fr 1fr 1fr;

  gap: 50px;
}
.boxes {
  /* border: 1px solid black; */
  border-radius: 10px;
  box-shadow: inset 0px 0px 5px 0px rgb(124, 124, 124);
  /* filter: drop-shadow(0px 0px 5px 0px black); */
  display: flex;
  flex-direction: column;
  
  align-items: center;
  /* padding: 20px; */
  height: 400px;
  gap: 20px;
}
.image {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 45%;
  overflow: hidden;

  width: 100%;
  position: relative;
}

.image .lostORfound {
  position: absolute;
  top: 0;
  right: 0;
  margin: 15px;
  font-family: sans-serif;
  letter-spacing: 0.5px;
  border-radius: 20px;
  background-color: rgb(201, 5, 5);
  padding: 3px 10px;
  font-size: 16px;
  color: white;
}

.title {
  display: flex;
  width: 100%;
  padding: 0px 20px;
  font-size: 25px;
  font-family: Arial, Helvetica, sans-serif;
  letter-spacing: 0.5px;
  font-weight: bold;
}
.description {
  display: flex;

  width: 100%;
  padding: 0px 20px;
  font-size: 14px;
  font-family: Arial, Helvetica, sans-serif;
  letter-spacing: 0.5px;
  height: 20%;
  overflow-y: scroll;
}
.description::-webkit-scrollbar {
  width: 4px;
}
button {
  padding: 8px 10px;
  border: none;
  color: white;
  background-color: #0f62a5;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.1s;
}
button:hover {
  transform: scale(1.03);
}
.footer {
  display: flex;
  align-items: center;
  flex-direction: column;
  justify-content: space-around;
  width: 100%;
  font-family: sans-serif;
  font-size: 18px;
  box-shadow: 0px 0px 05px 0px black;
  height: fit-content;
  padding: 20px 0px 10px 0px;
  color: white;
  gap: 15px;
  background: linear-gradient(135deg, #0f172a, #2b3c63);
}
.footer-upper {
  display: flex;
  /* flex-direction: column; */
  align-items: center;
  justify-content: space-around;
  width: 100%;
  gap: 15px;
  margin-bottom: 20px;
}
.footer-left {
  color: #a1bdff;
}
.footer-mid {
  display: flex;
  gap: 20px;
}
.footer-mid a {
  text-decoration: none;
  color: white;
  border-bottom: 1px solid white;
  transition: all 0.2s;
}
.footer-mid a:hover {
  color: #a1bdff;
  border-bottom: 1px solid #a1bdff;
  transform: scale(1.1);
}
hr {
  width: 95%;
  border: none;
  height: 1px;
  background-color: rgb(114, 111, 111);
  /* background-color: red; */
}
.footer-right {
  color: rgb(204, 203, 203);
}

@media (min-width: 1280px) and (max-width: 1450px) {
  .items-container {
    grid-template-columns: 1fr 1fr 1fr 1fr;
  }
  .boxes {
    height: 380px;
  }
  .image {
    height: 40%;
  }

  .title {
    display: flex;
  }
  .description {
    height: 25%;
  }

  .footer {
    flex-direction: column;
    /* font-size: 15px; */
    height: fit-content;
    margin: 0;
    padding: 15px 0px 10px 0px;
    gap: 15px;
  }
  .footer-left {
    color: #a1bdff;
    font-size: 20px;
  }
  .footer-mid {
    display: flex;
    gap: 20px;
  }
  .footer-mid a {
    color: white;
    font-size: 16px;
  }
}
